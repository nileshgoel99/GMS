# /etc/nginx/sites-available/gms — CRA + Django both use /static/; the ^~ /static/js/,
# /static/css/, and /static/media/ blocks must come before location /static/ or the
# React bundle/images 404.
# Install: sudo cp scripts/nginx-gms-site.conf /etc/nginx/sites-available/gms && sudo nginx -t && sudo systemctl reload nginx
#
# Domains: weavecore.in + www.weavecore.in
#   sudo certbot --nginx -d www.weavecore.in -d weavecore.in

server {
    listen 443 ssl http2;
    server_name www.weavecore.in weavecore.in;

    ssl_certificate /etc/letsencrypt/live/www.weavecore.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.weavecore.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/gms/frontend/build;
    index index.html;
    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/js/ {
        alias /var/www/gms/frontend/build/static/js/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /static/css/ {
        alias /var/www/gms/frontend/build/static/css/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /static/media/ {
        alias /var/www/gms/frontend/build/static/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /var/www/gms/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/gms/backend/media/;
    }
}

server {
    listen 80;
    server_name www.weavecore.in weavecore.in;
    return 301 https://$host$request_uri;
}
